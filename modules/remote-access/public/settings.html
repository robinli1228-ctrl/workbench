<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>独立远程访问设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#273047;font:15px/1.6 system-ui,sans-serif;padding:24px}main{max-width:760px;margin:auto}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 16px}p{color:#68738a;margin:8px 0 20px}.card{background:white;padding:24px;border:1px solid #e0e5ef;border-radius:12px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;font-size:13px;color:#586379}input{display:block;width:100%;font:inherit;color:#273047;border:1px solid #cbd2e1;border-radius:8px;padding:10px;margin-top:5px}input:focus{outline:2px solid #ced1ff;border-color:#656edb}button,a{font:inherit}button{border:0;border-radius:8px;background:#555ed6;color:white;padding:10px 16px;cursor:pointer}button.secondary{background:#edf0f9;color:#46516d}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#notice{padding:12px 0;min-height:48px;color:#a23e40}#state{font-weight:600}a{color:#505ace;overflow-wrap:anywhere}@media(max-width:560px){body{padding:16px}.grid{grid-template-columns:1fr}.card{padding:18px}}
</style>
<main>
<h1>独立远程访问设置</h1><p>仅在这台 Mac 管理。不会修改或重启 Workbench。</p>
<div id="notice" role="status" aria-live="polite"></div>
<section class="card"><h2>连接状态</h2><div id="state">读取中…</div><p id="detail"></p><a id="visit" target="_blank" rel="noreferrer" hidden>打开远程页面</a><div class="actions"><button type="button" id="test">测试 SSH 连接</button><button type="button" id="start">启用远程访问</button><button type="button" id="stop" class="secondary">停用</button><button type="button" id="refresh" class="secondary">刷新状态</button></div></section>
<form id="config" class="card"><h2>中转配置</h2><div class="grid">
<label class="wide">公开访问地址（HTTPS）<input name="publicOrigin" type="url" required placeholder="https://relay.example.com"></label>
<label>服务器地址<input name="host" required autocomplete="off"></label><label>SSH 端口<input name="port" type="number" min="1" max="65535" required></label>
<label>SSH 用户名<input name="user" required autocomplete="off"></label><label>服务器回环转发端口<input name="remotePort" type="number" min="1" max="65535" required></label>
<label class="wide">Mac 上的专用 SSH 私钥文件路径<input name="keyFile" required autocomplete="off"></label>
<label class="wide">本机 Home 地址<input name="homeUrl" type="url" required></label>
<label class="wide">Home API Token 文件路径（不显示内容）<input name="tokenFile" required autocomplete="off"></label>
</div><p>保存会停用当前远程隧道，原 Workbench 和任务继续运行。新服务器须先部署兼容中转入口。</p><button type="submit">保存配置并停用旧连接</button></form>
<form id="password" class="card"><h2>网页登录密码</h2><p>至少 12 个字符。登录固定有效 15 天；改密码后，所有设备需重新登录。</p><label>新密码<input name="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><div class="actions"><button type="submit">设置密码</button></div></form>
</main><script src="/settings.js" defer></script>
</html>
