<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Document · Agent Workbench</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="document-page">
  <main class="document-shell">
    <header class="document-heading">
      <div>
        <small>Agent Workbench · Project Document</small>
        <h1 id="document-title">Opening document…</h1>
      </div>
      <button id="document-copy" type="button" hidden>Copy full text</button>
    </header>
    <p id="document-status" role="status">Reading source from the executing device…</p>
    <article id="document-content" class="document-content"></article>
  </main>
  <script type="module" src="/document.js"></script>
</body>
</html>
